name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto el workflow solo puede leer. El permiso de escribir se da únicamente al job
# que publica el APK en Releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Acciones fijadas a un commit exacto: si alguien altera la etiqueta "v4", aquí no cambia nada.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Pruebas de la lógica de recordatorios
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Preparar la llave de firma (desde secretos cifrados)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Faltan los secretos SIGNING_KEYSTORE_B64 y/o SIGNING_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK firmado
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Borrar la llave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Preparar archivo y su huella SHA-256
        run: |
          cp app/build/outputs/apk/release/app-release.apk YaMerito.apk
          sha256sum YaMerito.apk > YaMerito.apk.sha256
          echo "APK_SHA256=$(cut -d' ' -f1 YaMerito.apk.sha256)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: YaMerito-${{ github.run_number }}
          path: |
            YaMerito.apk
            YaMerito.apk.sha256

      # Publica el APK en "Releases": el enlace .../releases/latest/download/YaMerito.apk
      # siempre apunta a la versión más nueva y se puede compartir por WhatsApp.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ya Merito 1.0.${{ github.run_number }}
          body: |
            APK para instalar directo en Android. Descarga YaMerito.apk.

            Huella SHA-256 del APK: `${{ env.APK_SHA256 }}`
          files: |
            YaMerito.apk
            YaMerito.apk.sha256
          make_latest: "true"
