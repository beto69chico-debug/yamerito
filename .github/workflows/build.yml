name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica de recordatorios
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Compilar APK firmado
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk YaMerito.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YaMerito-${{ github.run_number }}
          path: YaMerito.apk

      # Publica el APK en "Releases": el enlace .../releases/latest/download/YaMerito.apk
      # siempre apunta a la versión más nueva y se puede compartir por WhatsApp.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ya Merito 1.0.${{ github.run_number }}
          body: "APK para instalar directo en Android. Descarga YaMerito.apk."
          files: YaMerito.apk
          make_latest: "true"
